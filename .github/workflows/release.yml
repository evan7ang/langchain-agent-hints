name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    # The PyPI "pending publisher" must point at this exact environment name.
    environment: pypi
    permissions:
      # OIDC identity for PyPI Trusted Publishing — no API token involved.
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e '.[test,lint]' build twine
      - name: Test
        run: |
          ruff check .
          pytest
          mypy
      - name: Build distributions
        run: python -m build
      - name: Check distributions
        run: twine check dist/*
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Create GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/*
        env:
          GH_TOKEN: ${{ github.token }}
