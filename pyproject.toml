[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-agent-hints"
dynamic = ["version"]
description = "Per-request serving-intent hints (X-Agent-Hint) and out-of-band agent status events, as LangChain agent middleware."
readme = "README.md"
license = "MulanPSL-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "evan7ang" }]
keywords = ["langchain", "langgraph", "deepagents", "middleware", "agents", "llm", "serving"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["langchain>=1.4,<2.0"]

[project.optional-dependencies]
test = ["pytest>=8.0", "langchain-openai>=1.0"]
lint = ["mypy>=1.13", "ruff>=0.9"]

[project.urls]
Repository = "https://github.com/evan7ang/langchain-agent-hints"
Issues = "https://github.com/evan7ang/langchain-agent-hints/issues"
Documentation = "https://github.com/evan7ang/langchain-agent-hints/tree/main/docs"

[tool.hatch.version]
path = "src/langchain_agent_hints/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_agent_hints"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
